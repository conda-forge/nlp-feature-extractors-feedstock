{% set name = "nlp-feature-extractors" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/nlp_feature_extractors-{{ version }}.tar.gz
  sha256: d0b1cce74261086262037e7258489f7071106f66846e3eb32ca46966f0aa287d

build:
  noarch: python
  script:
    - cp -R {{ RECIPE_DIR }}/requirements.txt {{ SRC_DIR }}/requirements.txt  # [unix]
    - echo f | xcopy /f /y /S %RECIPE_DIR%\requirements.txt %SRC_DIR%\requirements.txt  # [win]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - datasets
    - gender-guesser >=0.4.0
    - negspacy >=1.0.0
    - numpy >=1.17.2
    - sentencepiece
    - spacy
    - tqdm
    - raiutils >=0.2.0

test:
  imports:
    - nlp_feature_extractors
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/microsoft/responsible-ai-widgets
  summary: NLP Feature Extractors
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
